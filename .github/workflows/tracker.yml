name: US Armada 24/7 Tracker

on:
  schedule:
    # Option A: Every 6 hours starting from 9:00 AM Iran/Tehran Time (05:30, 11:30, 17:30, 23:30 UTC)
    - cron: '30 5,11,17,23 * * *'

    # (If you meant 9:00 AM UTC instead, replace the cron above with: '0 3,9,15,21 * * *')

  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

jobs:
  track-and-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run Armada Tracker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tracker.py
