name: US Armada 24/7 Tracker

on:
  schedule:
    # Every 6 hours starting 09:00 Iran time (05:30, 11:30, 17:30, 23:30 UTC)
    - cron: '30 5,11,17,23 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Re-post the latest report even if already posted'
        type: boolean
        default: false

jobs:
  track-and-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Armada Tracker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_POST: ${{ inputs.force }}
        run: python tracker.py

      - name: Save last posted report
        run: |
          if [ -n "$(git status --porcelain last_posted.txt)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add last_posted.txt
            git commit -m "Update last posted report"
            git push
          fi
